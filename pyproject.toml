[tool.ruff]
# Исключаем папки, которые не нужно трогать
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    ".idea",
    "__pycache__"
]

# Длина строки (стандарт Black/PEP 8)
line-length = 88

# Версия Python проекта
target-version = "py313"

# Настройки Линтера (проверка качества кода)
[tool.ruff.lint]
# Список префиксов правил, которые мы хотим включить.
# Ruff объединяет правила из множества популярных линтеров (flake8, pylint, isort и др.).
select = [
    "E",   # pycodestyle errors: Ошибки стиля PEP 8 (например, лишние пробелы, отступы)
    "W",   # pycodestyle warnings: Предупреждения стиля PEP 8 (например, пустая строка в конце файла)
    "F",   # pyflakes: Логические ошибки (неиспользуемые импорты, неиспользуемые переменные, undefined names)
    "I",   # isort: Автоматическая сортировка импортов (группирует stdlib, third-party, local)
    "UP",  # pyupgrade: Предлагает использовать новый синтаксис Python (например, typing.List -> list)
    "B",   # flake8-bugbear: Поиск частых ошибок и антипаттернов (например, изменяемые аргументы по умолчанию)
    "C4",  # flake8-comprehensions: Проверка генераторов списков/словарей (предлагает упрощения)
    "SIM", # flake8-simplify: Упрощение кода (например, замена if-else на тернарный оператор)
]

# Игнорируем ошибку "строка слишком длинная",
# так как этим занимается форматтер, а не линтер
ignore = ["E501"]

[tool.ruff.format]
# Настройки форматера (аналог Black)
quote-style = "double" # Стиль кавычек: "double" (двойные) или "single" (одинарные).
indent-style = "space" # Стиль отступов: "space" (пробелы)